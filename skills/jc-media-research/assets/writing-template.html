<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究证据与写稿</title>
<style>
:root{color-scheme:light;--page:#f5f5f1;--paper:#fff;--ink:#242c31;--muted:#657176;--line:#dce2df;--accent:#176958}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"PingFang SC",sans-serif}button,select,textarea{font:inherit}button,select{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--paper);color:var(--ink);cursor:pointer}select{min-width:0;max-width:100%;width:min(100%,420px)}.source-button{max-width:100%;overflow-wrap:anywhere}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}a{color:var(--accent)}header{max-width:1440px;margin:auto;padding:28px 28px 14px}h1{font-size:28px;line-height:1.3;margin:6px 0 10px}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}.sub,.hint{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{font-size:13px;margin-left:auto}.layout{max-width:1440px;margin:auto;display:grid;grid-template-columns:175px minmax(0,1fr);gap:22px;padding:10px 28px 60px}nav{position:sticky;top:18px;align-self:start;display:grid;gap:7px}nav a{display:block;padding:9px 12px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;font-size:14px}nav a:hover{border-color:var(--accent);background:#e7efea}.section{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;scroll-margin-top:16px;overflow:hidden}.section-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center}.number{font-size:12px;color:var(--accent);letter-spacing:1px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.references,.own{padding:20px 22px;min-width:0}.references{background:#fafbf9;border-right:1px solid var(--line)}.source-card+.source-card{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.source-button{padding:2px 0;border:0;border-radius:0;background:transparent;color:var(--accent);font-size:13px;text-align:left}.prose{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.85}.source-text{font-size:14px;color:#3e484c;line-height:1.9}.own-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.own-head h3{margin:0}.mine-editor{width:100%;min-height:230px;resize:vertical;border:1px solid var(--accent);border-radius:8px;padding:12px;line-height:1.8;color:var(--ink);background:#fff}.note{width:100%;resize:vertical;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fcfcf9;font-size:14px;line-height:1.7}.notes{padding:0 22px 20px}.note-label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;padding:4px 9px;background:#f2f5f1}.review-status{color:#93612d;font-size:12px;margin-top:8px}.exact{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:#596e92;text-underline-offset:5px}mark{color:inherit;border-radius:3px;padding:1px 0;cursor:pointer}mark:focus-visible{outline:2px solid var(--accent)}.semantic-0{background:#e4eefa}.semantic-1{background:#e4f1e6}.semantic-2{background:#fff0d5}.semantic-3{background:#efe5f6}.semantic-4{background:#f9e2df}.detail{font-size:13px;color:var(--muted);margin-top:14px}.detail strong{color:var(--ink)}.conflict{background:#fff2da;padding:12px;border:1px solid #debd76;border-radius:8px;margin-top:12px}.dialog{position:fixed;inset:0;background:#172e3655;z-index:10;padding:5vh 18px;overflow:auto}.dialog-inner{max-width:900px;margin:auto;background:var(--paper);border-radius:16px;padding:26px;box-shadow:0 8px 60px #172e3640}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.evidence-quote{border-left:3px solid #94b6ac;padding-left:16px;margin:16px 0}.empty{padding:30px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){header{padding:22px 16px 10px}.layout{display:block;padding:8px 16px 32px}nav{position:static;display:flex;overflow:auto;margin-bottom:16px;gap:4px}nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:7px 10px}.columns{grid-template-columns:1fr}.references{border-right:0;border-bottom:1px solid var(--line)}.own,.references{padding:16px}.section-head{padding:16px}.notes{padding:0 16px 16px}.status{margin-left:0;width:100%}h1{font-size:24px}}@media print{nav,.toolbar,.notes,.edit-button,.tags,.status{display:none}.layout{display:block}.section{break-inside:avoid}.dialog{display:none}}
</style></head><body>
<header><div class="eyebrow">RESEARCH / WRITE</div><h1 id="title">研究证据与写稿</h1>
<p class="sub">左侧核对来源，右侧修改自己的稿子。颜色对应已复核的语义关系，点线标出连续字词重合。</p>
<div class="toolbar"><label for="source-filter" class="hint">参考来源</label><select id="source-filter"><option value="all">全部来源</option></select>
<button id="save" class="primary">保存修改</button><button id="export-md">导出稿件</button><button id="export-html">导出页面</button><button id="export-json">导出 JSON</button>
<span id="status" class="status" role="status">正在载入</span></div>
<div id="conflict" class="conflict" hidden><p>服务器已有新版本。本地输入已保留，当前不会覆盖服务器。可先导出本地稿件，再载入服务器版本核对。</p><button id="load-server">载入服务器版本</button></div>
</header><div class="layout"><nav id="nav" aria-label="段落导航"></nav><main id="sections"></main></div>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden><div class="dialog-inner"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog">关闭</button></div><div id="dialog-body"></div></div></div>
<script id="workbench-state" type="application/json">__WORKBENCH_STATE__</script>
<script>
'use strict';
let state;try{state=JSON.parse(document.getElementById('workbench-state').textContent)}catch{state={schema_version:2,task_id:'empty-template',title:'研究证据与写稿',revision:0,sources:[],sections:[]}}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filter='all',activeEdit=new Set(),dirty=false,seq=0,saving=false,queued=false,conflicted=false,serverState=null,timer;
const online=location.protocol==='http:'&&location.hostname==='127.0.0.1', key='jc-writing-v2:'+state.task_id;
const clone=o=>JSON.parse(JSON.stringify(o));
function status(s){$('status').textContent=s}
function stash(){try{localStorage.setItem(key,JSON.stringify({state,dirty}));return true}catch{return false}}
function source(sid){return state.sources.find(s=>s.source_id===sid)}
function normalize(t){const chars=[],indices=[];(()=>{let i=0;for(const c of t){if(/[\u4e00-\u9fff0-9]/.test(c)){chars.push(c);indices.push(i)}i+=c.length}})();return {chars,indices}}
function exact(a,b){const x=normalize(a),y=normalize(b),runs=[];let prev=new Uint32Array(y.chars.length+1);
for(let i=1;i<=x.chars.length;i++){const row=new Uint32Array(y.chars.length+1);for(let j=1;j<=y.chars.length;j++){if(x.chars[i-1]===y.chars[j-1]){row[j]=prev[j-1]+1;if(row[j]>=8&&(i===x.chars.length||j===y.chars.length||x.chars[i]!==y.chars[j])){const n=row[j];runs.push({left:[x.indices[i-n],x.indices[i-1]+1],right:[y.indices[j-n],y.indices[j-1]+1]})}}}prev=row}return runs}
function marked(text,groups,intervals){const cuts=new Set([0,text.length]), ranges=[];groups.forEach((g,i)=>{const anchor=g.anchor;let start=anchor?text.indexOf(anchor):-1;if(start>=0){cuts.add(start);cuts.add(start+anchor.length);ranges.push({start,end:start+anchor.length,id:g.id,color:Array.from(g.id).reduce((n,c)=>n+c.codePointAt(0),0)%5})}});intervals.forEach(([a,b])=>{cuts.add(a);cuts.add(b)});const points=[...cuts].sort((a,b)=>a-b);let out='';for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],g=ranges.find(r=>r.start<=a&&r.end>=b);let t=esc(text.slice(a,b));if(intervals.some(r=>r[0]<=a&&r[1]>=b))t='<span class="exact">'+t+'</span>';if(g)t='<mark tabindex="0" role="button" data-group="'+esc(g.id)+'" class="semantic-'+g.color+'">'+t+'</mark>';out+=t}return out}
function mineHtml(s){const groups=s.analysis_status==='reviewed'?(s.semantic_groups||[]).map(g=>({...g,anchor:g.mine})):[];const intervals=(s.references||[]).flatMap(r=>exact(r.quote,s.mine).map(x=>x.right));return marked(s.mine,groups,intervals)}
function refHtml(s,r){const groups=s.analysis_status==='reviewed'?(s.semantic_groups||[]).flatMap(g=>(g.sources||[]).filter(c=>c.source_id===r.source_id&&String(c.paragraph_id)===String(r.paragraph_id)).map(c=>({...g,anchor:c.quote}))):[];return marked(r.quote,groups,exact(r.quote,s.mine).map(x=>x.left))}
function refs(s){return (s.references||[]).filter(r=>filter==='all'||r.source_id===filter).map(r=>'<div class="source-card"><button class="source-button" data-source="'+esc(r.source_id)+'">'+esc(source(r.source_id)?.title||r.source_id)+' ↗</button><div class="prose source-text">'+refHtml(s,r)+'</div></div>').join('')||'<p class="hint">本段没有该来源的引用。</p>'}
function rowHtml(s,i){return '<section class="section" id="section-'+esc(s.id)+'" data-section="'+esc(s.id)+'"><div class="section-head"><div><div class="number">段落 '+String(i+1).padStart(2,'0')+'</div><h2>'+esc(s.title)+'</h2></div><span class="hint">'+(s.locked?'原文已锁定':'可编辑')+'</span></div><div class="columns"><div class="references">'+refs(s)+'</div><div class="own"><div class="own-head"><h3>我的稿子</h3><button class="edit-button" data-edit="'+esc(s.id)+'" '+(s.locked?'disabled':'')+'>'+(activeEdit.has(s.id)?'完成编辑':'编辑本段')+'</button></div><div class="prose mine-preview" '+(activeEdit.has(s.id)?'hidden':'')+'>'+mineHtml(s)+'</div><textarea aria-label="第 '+(i+1)+' 段稿件" class="mine-editor" data-mine="'+esc(s.id)+'" '+(activeEdit.has(s.id)?'':'hidden')+' '+(s.locked?'readonly':'')+'>'+esc(s.mine)+'</textarea><div class="review-status">'+(s.analysis_status==='reviewed'?'语义关系已复核；点击颜色查看依据。':'本段语义关系待复核；字词重合已按当前稿件重算。')+'</div><div class="tags">'+(s.semantic_groups||[]).map(g=>'<button class="tag" data-group="'+esc(g.id)+'">'+esc(g.label)+'</button>').join('')+'</div><div class="detail">'+(s.borrowed_logic?'<p><strong>参考逻辑：</strong>'+esc(s.borrowed_logic)+'</p>':'')+(s.expression_change?'<p><strong>表达变化：</strong>'+esc(s.expression_change)+'</p>':'')+(s.own_facts?.length?'<p><strong>本人事实：</strong></p>'+s.own_facts.map(r=>'<div class="evidence-quote"><button class="source-button" data-source="'+esc(r.source_id)+'">'+esc(source(r.source_id)?.title||r.source_id)+'</button><p>'+esc(r.quote)+'</p></div>').join(''):'')+(s.material_gap?'<p><strong>待补材料：</strong>'+esc(s.material_gap)+'</p>':'')+'</div></div></div><div class="notes"><label class="note-label" for="note-'+esc(s.id)+'">批注</label><textarea class="note" id="note-'+esc(s.id)+'" data-note="'+esc(s.id)+'" placeholder="保留、修改或待补的内容">'+esc(s.note||'')+'</textarea></div></section>'}
function render(){document.title=state.title;$('title').textContent=state.title;$('nav').innerHTML=state.sections.map((s,i)=>'<a href="#section-'+esc(s.id)+'">'+(i+1)+'. '+esc(s.title)+'</a>').join('');$('sections').innerHTML=state.sections.map(rowHtml).join('')||'<div class="empty">当前模板尚未载入稿件资料。</div>';const old=$('source-filter').value;$('source-filter').innerHTML='<option value="all">全部来源</option>'+state.sources.map(s=>'<option value="'+esc(s.source_id)+'">'+esc(s.title)+'</option>').join('');$('source-filter').value=filter;$('conflict').hidden=!conflicted}
function refreshRow(s){const el=document.querySelector('[data-section="'+CSS.escape(s.id)+'"]');el.querySelector('.mine-preview').innerHTML=mineHtml(s);el.querySelector('.references').innerHTML=refs(s);el.querySelector('.review-status').textContent=s.analysis_status==='reviewed'?'语义关系已复核；点击颜色查看依据。':'本段语义关系待复核；字词重合已按当前稿件重算。'}
function changed(){dirty=true;seq++;const stored=stash();status(stored?(online?'本地已暂存，等待保存':'已暂存到此浏览器；可导出文件'):'浏览器暂存不可用，请导出文件');clearTimeout(timer);if(online&&!conflicted)timer=setTimeout(save,700)}
async function save(){if(!online){stash();status('已暂存到此浏览器；请导出页面或 JSON 保存文件');return}if(conflicted)return;if(saving){queued=true;return}if(!dirty){status('当前没有未保存修改');return}saving=true;const stamp=seq;const payload={revision:state.revision,sections:state.sections.map(s=>({id:s.id,mine:s.mine,note:s.note||''}))};status('正在保存');try{const response=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench-Save':'1'},body:JSON.stringify(payload)});const result=await response.json();if(response.status===409){conflicted=true;$('conflict').hidden=false;status('版本冲突，本地输入已保留');stash();return}if(!response.ok)throw new Error(result.error||'保存失败');const local=state;state=result.state;if(seq!==stamp){state.sections.forEach(s=>{const l=local.sections.find(x=>x.id===s.id);s.mine=l.mine;s.note=l.note;if(s.mine!==s.reviewed_text)s.analysis_status='needs_review'});dirty=true;queued=true}else{dirty=false}stash();status(result.report_updated?'已保存 · 第 '+state.revision+' 版':result.report_error)}catch(e){status(e.message+'；本地输入已保留');stash()}finally{saving=false;if(queued&&!conflicted){queued=false;setTimeout(save,0)}}}
function dialog(title,body){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog').hidden=false;$('close-dialog').focus()}
function showSource(id){const s=source(id);if(s)dialog(s.title,'<p class="hint">来源原文只读</p><div class="prose">'+esc(s.text)+'</div>')}
function showGroup(id){for(const s of state.sections){const g=(s.semantic_groups||[]).find(x=>x.id===id);if(!g)continue;dialog(g.label,(s.analysis_status!=='reviewed'?'<p class="review-status">这条标注对应修改前的稿件，需要重新复核。</p>':'')+'<p>'+esc(g.comment||'')+'</p><div class="evidence-quote"><strong>我的稿子中的对应片段</strong><div class="prose">'+esc(g.mine)+'</div></div>'+g.sources.map(r=>'<div class="evidence-quote"><button class="source-button" data-source="'+esc(r.source_id)+'">'+esc(source(r.source_id)?.title||r.source_id)+'</button><div class="prose">'+esc(r.quote)+'</div></div>').join(''));return}}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('sections').addEventListener('input',e=>{const id=e.target.dataset.mine||e.target.dataset.note;if(!id)return;const s=state.sections.find(x=>x.id===id);if(e.target.dataset.mine){if(s.locked)return;s.mine=e.target.value;s.analysis_status=s.mine===s.reviewed_text?'reviewed':'needs_review';refreshRow(s)}else s.note=e.target.value;changed()});
document.addEventListener('click',e=>{const button=e.target.closest('[data-source],[data-group],[data-edit]');if(!button)return;if(button.dataset.source)showSource(button.dataset.source);if(button.dataset.group)showGroup(button.dataset.group);if(button.dataset.edit){const id=button.dataset.edit;if(activeEdit.has(id))activeEdit.delete(id);else activeEdit.add(id);render();if(activeEdit.has(id))document.querySelector('[data-mine="'+CSS.escape(id)+'"]').focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('dialog').hidden=true;if((e.key==='Enter'||e.key===' ')&&e.target.matches('mark[data-group]')){e.preventDefault();showGroup(e.target.dataset.group)}});
$('source-filter').onchange=e=>{filter=e.target.value;render()};$('save').onclick=save;$('close-dialog').onclick=()=>$('dialog').hidden=true;$('dialog').onclick=e=>{if(e.target===$('dialog'))$('dialog').hidden=true};
$('export-md').onclick=()=>download(state.task_id+'.md','# '+state.title+'\n\n'+state.sections.map(s=>'## '+s.title+'\n\n'+s.mine).join('\n\n'),'text/markdown');
$('export-json').onclick=()=>download(state.task_id+'.json',JSON.stringify(state,null,2),'application/json');
$('export-html').onclick=()=>{const copy=document.documentElement.cloneNode(true);copy.querySelector('#workbench-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');copy.querySelector('#dialog').hidden=true;download(state.task_id+'.html','<!doctype html>\n'+copy.outerHTML,'text/html')};
$('load-server').onclick=async()=>{try{const r=await fetch('/api/state');if(!r.ok)throw Error('无法读取服务器版本');state=await r.json();dirty=false;conflicted=false;stash();render();status('已载入服务器版本 · 第 '+state.revision+' 版')}catch(e){status(e.message)}};
window.addEventListener('beforeunload',()=>{if(dirty)stash()});
async function boot(){let cached;try{cached=JSON.parse(localStorage.getItem(key))}catch{}if(online){try{const r=await fetch('/api/state');if(!r.ok)throw Error();serverState=await r.json();state=serverState;if(cached?.dirty){if(cached.state.revision===state.revision){cached.state.sections.forEach(c=>{const s=state.sections.find(x=>x.id===c.id);if(s&&!s.locked){s.mine=c.mine;s.note=c.note;s.analysis_status=s.mine===s.reviewed_text?'reviewed':'needs_review'}});dirty=true}else{state=cached.state;dirty=true;conflicted=true}}}catch{status('本地服务读取失败，已保留页面中的内容')}}else if(cached?.state){state=cached.state;dirty=!!cached.dirty}render();status(conflicted?'版本冲突，本地输入已恢复':dirty?'已恢复本地未保存输入':online?'已载入 · 第 '+state.revision+' 版':'离线查看；修改暂存在此浏览器');if(dirty&&online&&!conflicted)timer=setTimeout(save,700)}
boot();
</script></body></html>
