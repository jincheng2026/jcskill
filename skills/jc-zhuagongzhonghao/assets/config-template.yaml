# ============================================
# 公众号热文抓取 - 配置文件
# 修改此文件即可调整搜索策略，无需改代码
# ============================================

# API 配置
api:
  key: "你的API_KEY（从dajiala.com获取）"
  url: "https://www.dajiala.com/fbmain/monitor/v3/kw_search"

# 搜索参数
search:
  sort_type: 1      # 1=按阅读量排序  2=按时间排序
  mode: 1            # 1=搜标题  2=搜正文  3=标题+正文
  period: 7          # 搜索天数（标题最大720天，正文最大30天）

# 搜索关键词组（每组独立搜索，每组花费约 ¥0.40）
# - name: 分组名称（显示在报告中）
# - kw: 必须包含的关键词（空格分隔=AND）
# - any_kw: 包含任意一个即可（空格分隔=OR）
# - ex_kw: 排除包含这些词的文章（空格分隔）
search_groups:
  - name: "AI工作流"
    kw: "AI工作流"
    any_kw: ""
    ex_kw: "招聘 论文 股票 课程推荐 培训班"

  - name: "Claude/Cursor/Agent"
    kw: "Claude"
    any_kw: "Cursor Agent MCP"
    ex_kw: ""

  - name: "AI自动化实战"
    kw: "AI"
    any_kw: "自动化 工作流 效率"
    ex_kw: "招聘 论文 股票 培训班 考研 高考 公务员"

  - name: "AI商业/一人公司"
    kw: "AI"
    any_kw: "一人公司 副业 个人IP 自媒体"
    ex_kw: "招聘 论文 股票 培训班"

# ============================================
# 评分规则（总分 0-100）
#
# 算法：Wilson Score + 三维度加权
# 参考：HN/Reddit 排名 + Amazon/Steam 评分
# ============================================

scoring:
  # 最低展示分数
  min_score: 20

  # 等级划分
  tiers:
    s: 55    # S级：≥55分（流量+信任都强）
    a: 35    # A级：≥35分
    # B级：20-34分

  # ════════════════════════════════════════
  # 三维度权重（总和=1.0）
  # ════════════════════════════════════════
  #
  # 你的目的：找到「能带流量 + 能建信任」的文章
  # 流量 = 阅读量（这个选题爆不爆）
  # 信任 = 互动率（读完的人认不认可）→ 用 Wilson Score 消除小样本噪音
  # 内容信号 = 关键词/原创/长度（辅助判断，防跑偏）
  #
  dimensions:
    weight_traffic: 0.40       # 流量权重 40%
    weight_trust: 0.50         # 信任权重 50%（你说信任非常重要）
    weight_content: 0.10       # 内容信号 10%（辅助）

    # 信任分参数
    min_reads_for_trust: 50    # 阅读<50时信任分归零（消除噪音）

    # 内容信号参数
    original_bonus: 30         # 原创+30（数据证明原创互动率是非原创3.4倍）
    positive_keyword_each: 3   # 每命中一个正面词+3
    positive_keyword_cap: 20   # 正面词上限
    negative_keyword_each: 10  # 每命中一个负面词-10
    negative_keyword_cap: 40   # 负面词上限
    long_content_bonus: 10     # 正文>500字+10

  # 正面关键词（辅助信号，权重已降）
  positive_keywords:
    # AI工具/平台
    - "Claude"
    - "Cursor"
    - "Agent"
    - "MCP"
    - "n8n"
    - "Dify"
    - "GPT"
    - "DeepSeek"
    - "Gemini"
    - "Prompt"
    - "提示词"
    # 实操信号
    - "实战"
    - "落地"
    - "工作流"
    - "workflow"
    - "自动化"
    - "搭建"
    - "教程"
    - "实操"
    - "案例"
    - "复盘"
    - "跑通"
    # 商业/IP
    - "一人公司"
    - "个人IP"
    - "自媒体"
    - "变现"
    # 技术
    - "代码"
    - "开发"
    - "开源"
    - "GitHub"

  # 负面关键词（过滤垃圾，权重不降）
  negative_keywords:
    - "广告"
    - "限时"
    - "免费领"
    - "扫码"
    - "进群"
    - "报名"
    - "焦虑"
    - "恐慌"
    - "颠覆"
    - "取代人类"
    - "失业"
    - "股票"
    - "基金"
    - "理财"
    - "房价"
    - "招聘"
    - "考研"
    - "公务员"
    - "高考"
    - "娱乐"
    - "八卦"
    - "明星"

# 部署配置
deploy:
  auto_deploy: true              # 生成报告后自动部署到 Vercel
  project_dir: "deploy"          # 部署目录（相对于脚本所在目录）
